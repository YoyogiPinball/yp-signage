<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f4f1ea">
	<!-- Android Chrome が履歴の時刻「14:03:12」を電話番号・日付と誤検出して下線付きのリンクにするのを止める -->
	<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
	<title>サイネージ操作盤</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #f4f1ea;
			--card: #ffffff;
			--sunk: #faf8f3;
			--ink: #16181c;
			--ink-soft: #5a6069;
			--rule: #e3ddd1;
			--rule-strong: #cfc7b6;
			--off: #b23a2b;
			--off-wash: #f8eae7;
			--radius: 14px;
			--mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-width: 320px;
			/* 罫紙のような横罫を薄く敷く。単色の面より、操作盤としての「台紙」感が出る。 */
			background:
				repeating-linear-gradient(
					to bottom,
					transparent 0 31px,
					rgba(22, 24, 28, .028) 31px 32px
				),
				var(--paper);
			color: var(--ink);
			font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
			font-size: 16px;
			line-height: 1.55;
			-webkit-text-size-adjust: 100%;
		}

		main {
			width: min(100% - 24px, 620px);
			margin: 0 auto;
			padding: max(22px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
		}

		.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

		svg.icon {
			width: 20px;
			height: 20px;
			flex: none;
			stroke: currentColor;
			stroke-width: 1.9;
			stroke-linecap: round;
			stroke-linejoin: round;
			fill: none;
		}

		/* ---- 見出し ---- */

		header {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 12px;
			padding-bottom: 12px;
			margin-bottom: 16px;
			border-bottom: 2px solid var(--ink);
		}

		.eyebrow {
			margin: 0 0 2px;
			color: var(--off);
			font: 700 .68rem/1.2 var(--mono);
			letter-spacing: .18em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
			font-size: clamp(1.6rem, 7.5vw, 2.3rem);
			font-weight: 700;
			letter-spacing: .04em;
			line-height: 1.15;
		}

		/* ---- 通知 ---- */

		.notice {
			display: none;
			margin: 12px 0 0;
			padding: 11px 13px;
			border: 1px solid var(--rule-strong);
			border-left: 4px solid var(--ink);
			border-radius: 10px;
			background: var(--card);
			font-size: .87rem;
		}

		.notice.show { display: block; }

		.notice.error {
			border-color: #e0b4ab;
			border-left-color: var(--off);
			background: var(--off-wash);
			color: #7d2013;
		}

		/* ---- 操作パネル ---- */

		.group { margin-top: 16px; }

		.group-head {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0 0 9px;
			color: var(--ink-soft);
			font-size: .72rem;
			font-weight: 700;
			letter-spacing: .16em;
		}

		.group-head::after {
			content: "";
			flex: 1;
			height: 1px;
			background: var(--rule-strong);
		}

		.control-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 9px;
		}

		button { font: inherit; }

		button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			min-height: 54px;
			padding: 10px 12px;
			border: 1px solid var(--rule-strong);
			border-radius: 11px;
			background: var(--card);
			color: var(--ink);
			font-weight: 700;
			letter-spacing: .02em;
			cursor: pointer;
			box-shadow: 0 1px 0 var(--rule-strong);
			transition: background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
			touch-action: manipulation;
		}

		button:hover { background: var(--sunk); border-color: var(--ink-soft); }
		button:active { box-shadow: none; transform: translateY(1px); }
		button:disabled { cursor: wait; opacity: .5; }

		button:focus-visible,
		summary:focus-visible {
			outline: 3px solid rgba(178, 58, 43, .45);
			outline-offset: 2px;
		}

		button.ghost {
			border-style: dashed;
			background: none;
			color: var(--ink-soft);
			box-shadow: none;
		}

		button.ghost:hover { background: var(--sunk); color: var(--ink); }

		/* ---- いま出ている画像 ---- */

		.now-card {
			border: 1px solid var(--rule);
			border-radius: 11px;
			background: var(--card);
			box-shadow: 0 1px 0 var(--rule-strong);
		}

		.now-head {
			display: grid;
			grid-template-columns: 64px minmax(0, 1fr);
			align-items: center;
			gap: 12px;
			padding: 12px 14px 10px;
		}

		/* 縮小画像は押すと拡大する。ファイル名のコピーとは別のボタンにしてあり、
		   ボタンの入れ子（HTMLとして成り立たない）を避けている。 */
		.shot-button {
			display: block;
			width: 100%;
			aspect-ratio: 1;
			min-height: 0;
			padding: 0;
			overflow: hidden;
			border: 1px solid var(--rule-strong);
			border-radius: 8px;
			background: var(--sunk);
			box-shadow: none;
		}

		/* 切り抜かずに全体を出す。サイネージは縦画面で写真も縦長が多く、正方形に
		   切り抜くと中央しか映らないため、小さくても全体が見えるほうが見分けられる。
		   余白は画面と同じ黒で埋めて、実際の見え方に寄せる。 */
		.shot-button img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
			background: #16181c;
		}

		/* まだ縮小できていない1枚。押しても何も出ないので、押せないことを見せる。 */
		.shot-button:disabled { opacity: .4; cursor: default; }
		.shot-button:disabled img { visibility: hidden; }

		/* ファイル名はそれ自体がコピーボタン。画面を見て気になった1枚の名前を、
		   手で打ち直さずに実機の操作へ持っていけるようにする。 */
		.now-file {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 20px;
			align-items: center;
			gap: 10px;
			width: 100%;
			min-height: 0;
			padding: 0;
			border: none;
			border-radius: 0;
			background: none;
			box-shadow: none;
			text-align: left;
		}

		.now-file:hover { background: none; }

		.now-name {
			font: 700 .95rem/1.45 var(--mono);
			/* 深いフォルダ名でも横に溢れさせない。区切りの無い長い名前でも折る。 */
			overflow-wrap: anywhere;
		}

		.now-file .icon { color: var(--ink-soft); }
		.now-file:hover .icon { color: var(--ink); }

		/* 取得できていないときはコピーするものが無いので、コピーの印も出さない。 */
		.now-file:not([data-file]) .icon,
		.now-file[data-file=""] .icon { visibility: hidden; }

		.now-meta {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 6px 12px;
			margin: 0;
			padding: 8px 14px 11px;
			border-top: 1px dashed var(--rule);
			color: var(--ink-soft);
			font: .76rem/1.5 var(--mono);
		}

		.tag {
			padding: 1px 7px;
			border: 1px solid var(--rule-strong);
			border-radius: 999px;
			background: var(--sunk);
			color: var(--ink-soft);
			font: 700 .68rem/1.5 var(--mono);
			letter-spacing: .04em;
			white-space: nowrap;
		}

		/* 読み込めなかった1枚。探して消すのはこの行なので、他の種別と色で分ける。 */
		.tag.broken {
			border-color: var(--off);
			background: var(--off-wash);
			color: #8f2a1d;
		}

		.history { margin-top: 9px; }

		.history-head {
			display: flex;
			align-items: center;
			gap: 9px;
			padding: 10px 4px;
			list-style: none;
			cursor: pointer;
			color: var(--ink-soft);
			font-size: .82rem;
			font-weight: 700;
		}

		.history-head::-webkit-details-marker { display: none; }
		.history[open] .chev { transform: rotate(180deg); }

		.history-list {
			margin: 0;
			padding: 0;
			border: 1px solid var(--rule);
			border-radius: 11px;
			background: var(--card);
			list-style: none;
			overflow: hidden;
		}

		.history-list li + li { border-top: 1px solid var(--rule); }

		/* 履歴の1行。左に縮小画像、右に時刻・名前・種別。名前側を押すとコピーする。 */
		.hist-row {
			display: grid;
			grid-template-columns: 48px minmax(0, 1fr);
			align-items: center;
			gap: 10px;
			padding: 8px 12px;
		}

		.hist-copy {
			display: grid;
			grid-template-columns: auto minmax(0, 1fr) auto;
			align-items: baseline;
			gap: 4px 10px;
			width: 100%;
			min-height: 0;
			padding: 0;
			border: none;
			border-radius: 0;
			background: none;
			box-shadow: none;
			font-weight: 400;
			text-align: left;
		}

		.hist-copy:hover { background: none; }

		.hist-time { color: var(--ink-soft); font: .74rem/1.5 var(--mono); }
		.hist-name { font: .82rem/1.5 var(--mono); overflow-wrap: anywhere; }
		.hist-copy .tag { justify-self: end; }

		/* いま出ている1枚は履歴の先頭にも並ぶ。どれが現在かを左の罫で示す。 */
		.history-list li:first-child .hist-row { box-shadow: inset 3px 0 0 var(--ink); }

		/* ---- 拡大表示 ---- */

		.viewer {
			width: min(94vw, 900px);
			max-height: 90vh;
			padding: 0;
			border: 1px solid var(--rule-strong);
			border-radius: var(--radius);
			background: var(--card);
			color: var(--ink);
			overflow: hidden;
		}

		.viewer::backdrop { background: rgba(22, 24, 28, .72); }

		/* 元の縦横比のまま収める。背景は画面と同じ黒にして、余白を帯として見せる。 */
		.viewer-img {
			display: block;
			width: 100%;
			max-height: 68vh;
			object-fit: contain;
			background: #16181c;
		}

		.viewer-bar {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			align-items: center;
			gap: 10px;
			padding: 11px 13px;
			border-top: 1px solid var(--rule);
		}

		/* 拡大したまま名前をコピーできるようにする。拡大して「これだ」と分かった直後に、
		   閉じてから押し直させない。 */
		.viewer-name {
			min-height: 0;
			padding: 0;
			border: none;
			border-radius: 0;
			background: none;
			box-shadow: none;
			font: .8rem/1.45 var(--mono);
			font-weight: 400;
			text-align: left;
			overflow-wrap: anywhere;
		}

		.viewer-name:hover { background: none; text-decoration: underline; }

		.viewer-bar button { min-height: 44px; padding: 8px 16px; }

		.history-empty {
			margin: 0;
			padding: 14px;
			color: var(--ink-soft);
			font-size: .82rem;
		}

		.chev { width: 18px; height: 18px; color: var(--ink-soft); transition: transform .18s ease; }

		/* ---- 読み込み時の段差 ---- */

		main > * { animation: rise .42s cubic-bezier(.2, .7, .3, 1) both; }
		main > *:nth-child(2) { animation-delay: .05s; }
		main > *:nth-child(3) { animation-delay: .1s; }

		@keyframes rise {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: none; }
		}

		@media (max-width: 430px) {
			main { width: min(100% - 18px, 620px); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				scroll-behavior: auto !important;
				transition: none !important;
				animation: none !important;
			}
		}
	</style>
</head>
<body>
	<svg class="sprite" aria-hidden="true" focusable="false"><defs>
		<symbol viewBox="0 0 24 24" id="i-pause"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-play"><path d="M6 4l14 8-14 8Z"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-prev"><path d="M15 18l-6-6 6-6"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-next"><path d="M9 18l6-6-6-6"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-copy"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-chevron-down"><path d="M6 9l6 6 6-6"/></symbol>
	</defs></svg>

	<main>
		<header>
			<div>
				<p class="eyebrow">YP Signage / Remote</p>
				<h1>サイネージ操作盤</h1>
			</div>
		</header>

		<div>
			<p id="auth-notice" class="notice error">本人限定の設定がまだ有効ではありません。</p>
			<p id="message" class="notice" role="status"></p>
		</div>

		<div>
			<div class="group">
				<h2 class="group-head">スライドショー</h2>
				<div class="control-grid">
					<button data-slideshow="prev"><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg>前へ</button>
					<button data-slideshow="next">次へ<svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
					<button data-slideshow="pause"><svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg>一時停止</button>
					<button data-slideshow="resume"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>再開</button>
				</div>
			</div>

			<div class="group">
				<h2 class="group-head">いま出ている画像</h2>
				<div class="now-card" aria-live="polite">
					<div class="now-head">
						<button id="now-shot" class="shot-button" type="button" aria-label="この画像を拡大して見る" disabled>
							<img id="now-thumb" alt="">
						</button>
						<button id="now-file" class="now-file" type="button" aria-label="ファイル名をコピー">
							<span id="now-name" class="now-name">取得中</span>
							<svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>
						</button>
					</div>
					<p id="now-meta" class="now-meta"></p>
				</div>

				<details class="history">
					<summary class="history-head">
						<svg class="chev icon" aria-hidden="true"><use href="#i-chevron-down"/></svg>直近10枚
					</summary>
					<div id="history" role="group" aria-label="直近に表示した画像"></div>
				</details>
			</div>
		</div>
	</main>

	<dialog id="viewer" class="viewer" aria-label="画像の拡大表示">
		<img id="viewer-img" class="viewer-img" alt="">
		<div class="viewer-bar">
			<button id="viewer-name" class="viewer-name" type="button" aria-label="ファイル名をコピー"></button>
			<button id="viewer-close" type="button" class="ghost">閉じる</button>
		</div>
	</dialog>

	<script>
		"use strict";

		const message = document.querySelector("#message");

		function showNotice(element, text, isError = false) {
			element.textContent = text;
			element.classList.toggle("error", isError);
			element.classList.toggle("show", Boolean(text));
		}

		/* ---- 状態 ---- */

		async function callApi(url, options = {}) {
			const response = await fetch(url, options);
			let result;
			try {
				result = await response.json();
			} catch {
				result = {};
			}
			if (!response.ok) {
				throw new Error(result.error || `HTTP ${response.status}`);
			}
			return result;
		}

		function updateStatus(data) {
			document.querySelector("#auth-notice").classList.toggle("show", !data.authRequired && data.viaRemote);
		}

		/* ---- いま出ている画像 ---- */

		// 履歴の種別。node_helper は素の reason（next / prev / alt / broken）を返すので、
		// 画面に出す言葉はこちらで持つ。ラベルが無い行は自動送り。
		const NOW_REASONS = { next: "次へ", prev: "前へ", alt: "代替", broken: "壊れ" };

		const nowName = document.querySelector("#now-name");
		const nowMeta = document.querySelector("#now-meta");
		const nowFile = document.querySelector("#now-file");
		const nowShot = document.querySelector("#now-shot");
		const nowThumb = document.querySelector("#now-thumb");
		const historyRoot = document.querySelector("#history");
		const viewer = document.querySelector("#viewer");
		const viewerImg = document.querySelector("#viewer-img");
		const viewerName = document.querySelector("#viewer-name");
		let nowPending = false;
		let renderedHistory = "";

		// 縮小画像の在りか。同じ URL ならブラウザがキャッシュを使うので、
		// 一覧を作り直しても取り直しは起きない。
		function shotUrl(file, size) {
			return `/api/slideshow/shot?size=${size}&file=${encodeURIComponent(file)}`;
		}

		function setThumb(img, file, hasShot) {
			const wanted = hasShot ? shotUrl(file, "thumb") : "";
			// 同じ画像で src を入れ直すと一瞬消えるので、変わったときだけ差し替える。
			if (img.getAttribute("src") === wanted) return;
			if (wanted) img.src = wanted;
			else img.removeAttribute("src");
		}

		function openViewer(file) {
			if (!file) return;
			viewerImg.src = shotUrl(file, "preview");
			viewerName.textContent = file;
			viewerName.dataset.file = file;
			if (!viewer.open) viewer.showModal();
		}

		function makeTag(reason) {
			if (!NOW_REASONS[reason]) return null;
			const tag = document.createElement("span");
			tag.className = reason === "broken" ? "tag broken" : "tag";
			tag.textContent = NOW_REASONS[reason];
			return tag;
		}

		async function copyFile(file) {
			if (!file) return;
			try {
				await navigator.clipboard.writeText(file);
				showNotice(message, `${file} をコピーしました。`);
			} catch {
				// Tailscale Serve 経由（HTTPS）なら通る。素の http でポートを直打ちしたときは
				// ブラウザがコピーを拒むので、その場合の手段を案内する。
				showNotice(message, "コピーできませんでした。ファイル名を長押しで選んでください。", true);
			}
		}

		function makeShotButton(item) {
			const button = document.createElement("button");
			button.type = "button";
			button.className = "shot-button";
			button.dataset.file = item.file;
			// 表示した直後はまだ縮小できていない。押せる見た目にして何も出ないより、
			// 押せないことを見せる。
			button.disabled = !item.hasShot;
			button.setAttribute("aria-label", `${item.file} を拡大して見る`);
			const img = document.createElement("img");
			img.alt = "";
			setThumb(img, item.file, item.hasShot);
			button.appendChild(img);
			return button;
		}

		function renderHistory(recent) {
			// 中身が変わっていなければ作り直さない。5秒ごとに全部組み直すと、
			// 開いている一覧が更新のたびにちらつく。
			const serialized = JSON.stringify(recent);
			if (serialized === renderedHistory) return;
			renderedHistory = serialized;

			historyRoot.textContent = "";
			if (recent.length === 0) {
				const empty = document.createElement("p");
				empty.className = "history-empty";
				empty.textContent = "まだ履歴がありません。";
				historyRoot.appendChild(empty);
				return;
			}
			const list = document.createElement("ol");
			list.className = "history-list";
			// 受け取る配列は末尾が最新。新しい順に直して、いま出ている1枚を先頭に置く。
			for (const item of [...recent].reverse()) {
				const row = document.createElement("div");
				row.className = "hist-row";
				row.appendChild(makeShotButton(item));

				const copy = document.createElement("button");
				copy.type = "button";
				copy.className = "hist-copy";
				copy.dataset.file = item.file;
				const time = document.createElement("span");
				time.className = "hist-time";
				time.textContent = item.time;
				const name = document.createElement("span");
				name.className = "hist-name";
				name.textContent = item.file;
				copy.append(time, name);
				const tag = makeTag(item.reason);
				if (tag) copy.appendChild(tag);
				row.appendChild(copy);

				const line = document.createElement("li");
				line.appendChild(row);
				list.appendChild(line);
			}
			historyRoot.appendChild(list);
		}

		function updateNow(data) {
			const current = data.current;
			nowFile.dataset.file = current ? current.file : "";
			nowName.textContent = current ? current.file : "まだ画像を表示していません";
			nowShot.dataset.file = current ? current.file : "";
			nowShot.disabled = !(current && current.hasShot);
			setThumb(nowThumb, current ? current.file : "", Boolean(current && current.hasShot));
			nowMeta.textContent = "";
			if (current) {
				const detail = [`${current.time} から表示`];
				// 枚数は MagicMirror を再起動すると数え直しになる。0 のときは出さない。
				if (current.total > 0) detail.push(`${current.position} / ${current.total} 枚目`);
				nowMeta.appendChild(document.createTextNode(detail.join("　")));
				const tag = makeTag(current.reason);
				if (tag) nowMeta.appendChild(tag);
			}
			renderHistory(Array.isArray(data.recent) ? data.recent : []);
		}

		function showNowError(detail) {
			nowFile.dataset.file = "";
			nowName.textContent = "取得できません";
			nowShot.dataset.file = "";
			nowShot.disabled = true;
			setThumb(nowThumb, "", false);
			nowMeta.textContent = detail;
			renderHistory([]);
		}

		nowFile.addEventListener("click", () => copyFile(nowFile.dataset.file));
		nowShot.addEventListener("click", () => openViewer(nowShot.dataset.file));
		historyRoot.addEventListener("click", (event) => {
			const shot = event.target.closest(".shot-button");
			if (shot) {
				openViewer(shot.dataset.file);
				return;
			}
			const copy = event.target.closest(".hist-copy");
			if (copy) copyFile(copy.dataset.file);
		});

		viewerName.addEventListener("click", () => copyFile(viewerName.dataset.file));
		document.querySelector("#viewer-close").addEventListener("click", () => viewer.close());
		viewer.addEventListener("click", (event) => {
			// 画像の外側（背景）を押したら閉じる。dialog 自身がその当たり判定になる。
			if (event.target === viewer) viewer.close();
		});
		// 閉じたら画像を外す。次に別の1枚を開いたとき、前の画像が一瞬見えるのを防ぐ。
		viewer.addEventListener("close", () => viewerImg.removeAttribute("src"));

		/* ---- 操作 ---- */

		async function runButton(button, action, successText) {
			button.disabled = true;
			try {
				await action();
				showNotice(message, successText);
			} catch (error) {
				showNotice(message, `操作できませんでした: ${error.message}`, true);
			} finally {
				button.disabled = false;
			}
		}

		document.querySelectorAll("[data-slideshow]").forEach((button) => {
			button.addEventListener("click", function () {
				const labels = { pause: "一時停止しました。", resume: "再開しました。", prev: "前の画像へ移動しました。", next: "次の画像へ移動しました。" };
				runButton(this, () => callApi(`/api/slideshow/${this.dataset.slideshow}`, { method: "POST" }), labels[this.dataset.slideshow]);
			});
		});

		async function refresh() {
			try {
				updateStatus(await callApi("/api/status"));
			} catch (error) {
				showNotice(message, `状態を取得できません: ${error.message}`, true);
			}
		}

		async function refreshNow() {
			// 前の問い合わせが返る前に次を投げない。MagicMirror が止まっていると応答が
			// タイムアウト（5秒）まで返らず、更新間隔と重なって要求が溜まる。
			if (nowPending) return;
			nowPending = true;
			try {
				updateNow(await callApi("/api/slideshow/now"));
			} catch (error) {
				showNowError(`MagicMirror が動いていない可能性があります（${error.message}）`);
			} finally {
				nowPending = false;
			}
		}

		// 本人限定の状態と表示中の画像は別々に取りに行く。片方が詰まっても、もう片方は動く。
		function refreshAll() {
			refresh();
			refreshNow();
		}

		// 背面に回ったタブでは、ブラウザが定期実行を止める。前面へ戻したときに
		// 古い表示のまま5秒待たせないよう、その場で取り直す。
		document.addEventListener("visibilitychange", () => {
			if (!document.hidden) refreshAll();
		});

		refreshAll();
		setInterval(refreshAll, 5000);
	</script>
</body>
</html>
