<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f4f1ea">
	<!-- Android Chrome が「01:00」を電話番号・日付と誤検出して下線付きのリンクにするのを止める -->
	<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
	<title>サイネージ操作盤</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #f4f1ea;
			--card: #ffffff;
			--sunk: #faf8f3;
			--ink: #16181c;
			--ink-soft: #5a6069;
			--rule: #e3ddd1;
			--rule-strong: #cfc7b6;
			--on: #1d6b4f;
			--on-wash: #e9f1ec;
			--off: #b23a2b;
			--off-wash: #f8eae7;
			--radius: 14px;
			--mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-width: 320px;
			/* 罫紙のような横罫を薄く敷く。単色の面より、操作盤としての「台紙」感が出る。 */
			background:
				repeating-linear-gradient(
					to bottom,
					transparent 0 31px,
					rgba(22, 24, 28, .028) 31px 32px
				),
				var(--paper);
			color: var(--ink);
			font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
			font-size: 16px;
			line-height: 1.55;
			-webkit-text-size-adjust: 100%;
		}

		main {
			width: min(100% - 24px, 620px);
			margin: 0 auto;
			padding: max(22px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
		}

		.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

		svg.icon {
			width: 20px;
			height: 20px;
			flex: none;
			stroke: currentColor;
			stroke-width: 1.9;
			stroke-linecap: round;
			stroke-linejoin: round;
			fill: none;
		}

		/* ---- 見出し ---- */

		header {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 12px;
			padding-bottom: 12px;
			margin-bottom: 16px;
			border-bottom: 2px solid var(--ink);
		}

		.eyebrow {
			margin: 0 0 2px;
			color: var(--off);
			font: 700 .68rem/1.2 var(--mono);
			letter-spacing: .18em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
			font-size: clamp(1.6rem, 7.5vw, 2.3rem);
			font-weight: 700;
			letter-spacing: .04em;
			line-height: 1.15;
		}

		#timezone {
			flex: none;
			padding-bottom: 3px;
			color: var(--ink-soft);
			font: .7rem/1 var(--mono);
			letter-spacing: .04em;
		}

		/* ---- 状態カード ---- */

		.status-card {
			position: relative;
			overflow: hidden;
			padding: 16px 18px 14px 22px;
			border: 1px solid var(--rule);
			border-radius: var(--radius);
			background: var(--card);
			box-shadow: 0 1px 0 var(--rule-strong), 0 10px 24px -18px rgba(22, 24, 28, .5);
		}

		.status-card::before {
			content: "";
			position: absolute;
			inset: 0 auto 0 0;
			width: 6px;
			background: var(--rule-strong);
		}

		.status-card.on::before { background: var(--on); }
		.status-card.off::before { background: var(--off); }

		.status-head {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.status-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: var(--rule-strong);
			box-shadow: 0 0 0 4px rgba(207, 199, 182, .35);
		}

		.on .status-dot { background: var(--on); box-shadow: 0 0 0 4px rgba(29, 107, 79, .16); }
		.off .status-dot { background: var(--off); box-shadow: 0 0 0 4px rgba(178, 58, 43, .16); }

		#display-state {
			font-size: 1.5rem;
			font-weight: 800;
			letter-spacing: .06em;
		}

		#mode-badge {
			margin-left: auto;
			padding: 3px 9px;
			border: 1px solid var(--rule-strong);
			border-radius: 999px;
			background: var(--sunk);
			color: var(--ink-soft);
			font-size: .74rem;
			font-weight: 700;
			letter-spacing: .04em;
			white-space: nowrap;
		}

		#mode-badge.manual {
			border-color: var(--off);
			background: var(--off-wash);
			color: var(--off);
		}

		#mode-detail {
			margin: 8px 0 0 22px;
			color: var(--ink-soft);
			font-size: .88rem;
		}

		#hardware-state {
			margin: 10px 0 0 22px;
			padding-top: 8px;
			border-top: 1px dashed var(--rule);
			color: var(--ink-soft);
			font: .7rem/1.4 var(--mono);
			letter-spacing: .02em;
		}

		/* ---- 通知 ---- */

		.notice {
			display: none;
			margin: 12px 0 0;
			padding: 11px 13px;
			border: 1px solid var(--rule-strong);
			border-left: 4px solid var(--ink);
			border-radius: 10px;
			background: var(--card);
			font-size: .87rem;
		}

		.notice.show { display: block; }

		.notice.error {
			border-color: #e0b4ab;
			border-left-color: var(--off);
			background: var(--off-wash);
			color: #7d2013;
		}

		/* ---- タブ ---- */

		.tabs {
			display: flex;
			gap: 6px;
			margin: 18px 0 0;
			padding: 5px;
			border: 1px solid var(--rule);
			border-radius: 12px;
			background: rgba(255, 255, 255, .7);
		}

		.tab {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			min-height: 46px;
			padding: 0 10px;
			border: 1px solid transparent;
			border-radius: 9px;
			background: none;
			color: var(--ink-soft);
			font: inherit;
			font-weight: 700;
			letter-spacing: .04em;
			cursor: pointer;
			transition: background-color .18s ease, color .18s ease, border-color .18s ease;
		}

		.tab:hover { background: var(--sunk); color: var(--ink); }

		.tab[aria-selected="true"] {
			border-color: var(--ink);
			background: var(--ink);
			color: var(--paper);
		}

		.tab .dirty-dot {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: var(--off);
			opacity: 0;
		}

		.tab.dirty .dirty-dot { opacity: 1; }

		[role="tabpanel"] { padding-top: 4px; }
		[role="tabpanel"][hidden] { display: none; }

		/* ---- 操作パネル ---- */

		.group { margin-top: 16px; }

		.group-head {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0 0 9px;
			color: var(--ink-soft);
			font-size: .72rem;
			font-weight: 700;
			letter-spacing: .16em;
		}

		.group-head::after {
			content: "";
			flex: 1;
			height: 1px;
			background: var(--rule-strong);
		}

		.control-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 9px;
		}

		button, input { font: inherit; }

		button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			min-height: 54px;
			padding: 10px 12px;
			border: 1px solid var(--rule-strong);
			border-radius: 11px;
			background: var(--card);
			color: var(--ink);
			font-weight: 700;
			letter-spacing: .02em;
			cursor: pointer;
			box-shadow: 0 1px 0 var(--rule-strong);
			transition: background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
			touch-action: manipulation;
		}

		button:hover { background: var(--sunk); border-color: var(--ink-soft); }
		button:active { box-shadow: none; transform: translateY(1px); }
		button:disabled { cursor: wait; opacity: .5; }

		button:focus-visible,
		input:focus-visible,
		summary:focus-visible {
			outline: 3px solid rgba(178, 58, 43, .45);
			outline-offset: 2px;
		}

		/* 点灯は「入れる」操作なので墨ベタ、消灯は朱の輪郭。並べたとき役割が一目で割れる。 */
		button.solid {
			border-color: var(--ink);
			background: var(--ink);
			color: var(--paper);
			box-shadow: 0 1px 0 #000;
		}

		button.solid:hover { background: #2b2f36; border-color: #2b2f36; }

		button.danger {
			border-color: var(--off);
			background: var(--off-wash);
			color: #8f2a1d;
		}

		button.danger:hover { background: #f2ded9; border-color: #8f2a1d; }

		button.wide { grid-column: 1 / -1; }

		button.ghost {
			border-style: dashed;
			background: none;
			color: var(--ink-soft);
			box-shadow: none;
		}

		button.ghost:hover { background: var(--sunk); color: var(--ink); }

		/* 上書き中だけ「自動に戻す」を目立たせる。ふだんは押す必要のないボタン。 */
		button.ghost.suggested {
			border-style: solid;
			border-color: var(--on);
			background: var(--on-wash);
			color: #14563e;
		}

		/* ---- 予定パネル ---- */

		.schedule-hint {
			margin: 16px 0 10px;
			color: var(--ink-soft);
			font-size: .82rem;
		}

		.day-card {
			border: 1px solid var(--rule);
			border-radius: 11px;
			background: var(--card);
			margin-bottom: 8px;
		}

		.day-card[open] { border-color: var(--rule-strong); box-shadow: 0 1px 0 var(--rule-strong); }

		.day-head {
			display: grid;
			grid-template-columns: 18px minmax(0, 1fr);
			align-items: center;
			gap: 2px 9px;
			padding: 12px 14px;
			list-style: none;
			cursor: pointer;
			border-radius: 10px;
		}

		.day-head::-webkit-details-marker { display: none; }
		.day-head:hover { background: var(--sunk); }

		.chev { width: 18px; height: 18px; color: var(--ink-soft); transition: transform .18s ease; }
		.day-card[open] .chev { transform: rotate(180deg); }

		.day-name { font-weight: 700; letter-spacing: .04em; }

		.day-badge {
			margin-left: 7px;
			padding: 1px 7px;
			border-radius: 999px;
			background: var(--ink);
			color: var(--paper);
			font-size: .66rem;
			font-weight: 700;
			letter-spacing: .06em;
			vertical-align: 2px;
		}

		.day-summary {
			grid-column: 2;
			display: flex;
			flex-wrap: wrap;
			gap: 0 14px;
			color: var(--ink-soft);
			font: .76rem/1.5 var(--mono);
			letter-spacing: .01em;
		}

		/* 1本の時間帯の途中では折らない。「18:00 – 翌」で改行されると読めなくなる。 */
		.day-summary span { white-space: nowrap; }

		.day-summary.empty { color: var(--off); }

		.day-body { padding: 0 14px 13px; border-top: 1px dashed var(--rule); margin-top: 2px; padding-top: 12px; }

		/* 1行目は「ラベル＋入力欄」だけにして開始と終了の高さをそろえ、
		 * 「翌日」と「削除」は2行目へ逃がす。終了側だけ背が高いと、間の「–」が
		 * 入力欄の中心からずれて宙に浮いた記号に見える。 */
		.range-row {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr) auto;
			align-items: end;
			gap: 8px;
			margin-bottom: 8px;
			padding: 10px;
			border: 1px solid var(--rule);
			border-radius: 10px;
			background: var(--sunk);
		}

		.range-row.invalid { border-color: var(--off); background: var(--off-wash); }

		.field-label {
			display: block;
			margin: 0 0 4px;
			color: var(--ink-soft);
			font-size: .68rem;
			font-weight: 700;
			letter-spacing: .1em;
		}

		input[type="time"] {
			width: 100%;
			min-height: 46px;
			padding: 8px;
			border: 1px solid var(--rule-strong);
			border-radius: 8px;
			background: var(--card);
			color: var(--ink);
			font-family: var(--mono);
		}

		.field.from { grid-area: 1 / 1; }
		.arrow { grid-area: 1 / 2; }
		.field.to { grid-area: 1 / 3; }
		.delete-row { grid-area: 1 / 4; }
		.next-day { grid-area: 2 / 3; }

		/* 入力欄と同じ高さの箱にして下端でそろえる。ラベル1行ぶん高い列と並んでも中心が合う。 */
		.arrow {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 46px;
			color: var(--ink-soft);
		}

		.next-day {
			display: flex;
			align-items: center;
			gap: 6px;
			min-height: 34px;
			color: var(--ink-soft);
			font-size: .78rem;
			cursor: pointer;
		}

		.next-day input { width: 19px; height: 19px; accent-color: var(--off); }

		.delete-row {
			width: 46px;
			min-height: 46px;
			padding: 0;
			border-color: #e0b4ab;
			background: var(--card);
			color: var(--off);
		}

		.delete-row:hover { background: var(--off-wash); border-color: var(--off); }
		/* 46px 角のときは入らないので隠し、横幅いっぱいに伸びる狭い画面だけ出す。 */
		.delete-label { display: none; font-size: .8rem; }

		.day-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

		.day-actions button {
			min-height: 42px;
			padding: 6px 8px;
			font-size: .76rem;
			font-weight: 700;
		}

		.day-actions .add-row { grid-column: 1 / -1; }
		.day-actions svg.icon { width: 16px; height: 16px; }

		.save-bar {
			position: sticky;
			bottom: max(10px, env(safe-area-inset-bottom));
			z-index: 2;
			margin-top: 14px;
			padding: 8px;
			border: 1px solid var(--rule-strong);
			border-radius: 13px;
			background: rgba(244, 241, 234, .92);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
		}

		#save-schedule { width: 100%; }
		#schedule-errors { margin-top: 10px; white-space: pre-line; }

		/* ---- 読み込み時の段差 ---- */

		main > * { animation: rise .42s cubic-bezier(.2, .7, .3, 1) both; }
		main > *:nth-child(2) { animation-delay: .05s; }
		main > *:nth-child(3) { animation-delay: .1s; }
		main > *:nth-child(4) { animation-delay: .14s; }

		@keyframes rise {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: none; }
		}

		@media (max-width: 430px) {
			main { width: min(100% - 18px, 620px); }
			/* 狭い画面では削除を2行目へ下ろし、「翌日」と横に並べる。
			 * 横いっぱいの削除ボタンだけで1行使うと、時間帯1本ぶんが縦に伸びすぎる。 */
			.range-row { grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr); }
			.next-day { grid-area: 2 / 1 / 3 / 3; }
			.delete-row { grid-area: 2 / 3; width: 100%; min-height: 42px; }
			.delete-label { display: inline; }
			.day-actions { grid-template-columns: 1fr; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				scroll-behavior: auto !important;
				transition: none !important;
				animation: none !important;
			}
		}
	</style>
</head>
<body>
	<svg class="sprite" aria-hidden="true" focusable="false"><defs>
		<symbol viewBox="0 0 24 24" id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-sunrise"><path d="M12 2v8M4.93 10.93l1.41-1.41M2 18h2M20 18h2M19.07 10.93l-1.41-1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-auto"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-pause"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-play"><path d="M6 4l14 8-14 8Z"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-prev"><path d="M15 18l-6-6 6-6"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-next"><path d="M9 18l6-6-6-6"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-plus"><path d="M5 12h14M12 5v14"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-trash"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-copy"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-check"><path d="M20 6L9 17l-5-5"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-sliders"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-calendar"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
		<symbol viewBox="0 0 24 24" id="i-chevron-down"><path d="M6 9l6 6 6-6"/></symbol>
	</defs></svg>

	<main>
		<header>
			<div>
				<p class="eyebrow">YP Signage / Remote</p>
				<h1>サイネージ操作盤</h1>
			</div>
			<small id="timezone"></small>
		</header>

		<section id="status-card" class="status-card" aria-live="polite">
			<div class="status-head">
				<span class="status-dot" aria-hidden="true"></span>
				<strong id="display-state">確認中</strong>
				<span id="mode-badge">取得中</span>
			</div>
			<p id="mode-detail">状態を取得しています</p>
			<p id="hardware-state"></p>
		</section>

		<div>
			<p id="auth-notice" class="notice error">本人限定の設定がまだ有効ではありません。</p>
			<p id="message" class="notice" role="status"></p>
		</div>

		<div>
			<div class="tabs" role="tablist" aria-label="操作盤の表示切り替え">
				<button class="tab" type="button" role="tab" id="tab-control" aria-controls="panel-control" aria-selected="true">
					<svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>操作
				</button>
				<button class="tab" type="button" role="tab" id="tab-schedule" aria-controls="panel-schedule" aria-selected="false" tabindex="-1">
					<svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>予定
					<span class="dirty-dot" aria-hidden="true"></span>
				</button>
			</div>

			<section id="panel-control" role="tabpanel" aria-labelledby="tab-control" tabindex="0">
				<div class="group">
					<h2 class="group-head">画面</h2>
					<div class="control-grid">
						<button class="solid" data-action="display-on"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg>つける</button>
						<button class="danger" data-action="display-off"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>消す</button>
						<button class="danger wide" data-action="off-morning"><svg class="icon" aria-hidden="true"><use href="#i-sunrise"/></svg>明日の朝7時まで消す</button>
						<button class="ghost wide" data-action="automatic"><svg class="icon" aria-hidden="true"><use href="#i-auto"/></svg>自動に戻す</button>
					</div>
				</div>

				<div class="group">
					<h2 class="group-head">スライドショー</h2>
					<div class="control-grid">
						<button data-slideshow="prev"><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg>前へ</button>
						<button data-slideshow="next">次へ<svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
						<button data-slideshow="pause"><svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg>一時停止</button>
						<button data-slideshow="resume"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>再開</button>
					</div>
				</div>
			</section>

			<section id="panel-schedule" role="tabpanel" aria-labelledby="tab-schedule" tabindex="0" hidden>
				<p class="schedule-hint">曜日をタップすると時間帯を編集できます。保存するまで画面には反映されません。</p>
				<div id="schedule"></div>
				<p id="schedule-errors" class="notice error" role="alert"></p>
				<div class="save-bar">
					<button id="save-schedule" class="solid"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>予定を保存</button>
				</div>
			</section>
		</div>
	</main>

	<script>
		"use strict";

		const DAYS = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
		const scheduleRoot = document.querySelector("#schedule");
		const message = document.querySelector("#message");
		const scheduleErrors = document.querySelector("#schedule-errors");
		const scheduleTab = document.querySelector("#tab-schedule");
		let scheduleDirty = false;
		let renderedSchedule = "";

		function markDirty() {
			scheduleDirty = true;
			scheduleTab.classList.add("dirty");
		}

		function clearDirty() {
			scheduleDirty = false;
			scheduleTab.classList.remove("dirty");
		}

		function showNotice(element, text, isError = false) {
			element.textContent = text;
			element.classList.toggle("error", isError);
			element.classList.toggle("show", Boolean(text));
		}

		/* ---- タブ ---- */

		const tabs = [...document.querySelectorAll('[role="tab"]')];

		function selectTab(tab) {
			tabs.forEach((item) => {
				const selected = item === tab;
				item.setAttribute("aria-selected", String(selected));
				item.tabIndex = selected ? 0 : -1;
				document.querySelector(`#${item.getAttribute("aria-controls")}`).hidden = !selected;
			});
		}

		tabs.forEach((tab, index) => {
			tab.addEventListener("click", () => selectTab(tab));
			tab.addEventListener("keydown", (event) => {
				const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
				if (!step) return;
				event.preventDefault();
				const next = tabs[(index + step + tabs.length) % tabs.length];
				selectTab(next);
				next.focus();
			});
		});

		/* ---- 状態 ---- */

		async function callApi(url, options = {}) {
			const response = await fetch(url, {
				...options,
				headers: options.body ? { "Content-Type": "application/json" } : undefined,
			});
			let result;
			try {
				result = await response.json();
			} catch {
				result = {};
			}
			if (!response.ok) {
				const detail = Array.isArray(result.errors) ? result.errors.join(" / ") : result.error;
				throw new Error(detail || `HTTP ${response.status}`);
			}
			return result;
		}

		function formatDateTime(epoch) {
			if (!Number.isFinite(epoch)) return "予定なし";
			return new Intl.DateTimeFormat("ja-JP", {
				month: "numeric",
				day: "numeric",
				weekday: "short",
				hour: "2-digit",
				minute: "2-digit",
			}).format(new Date(epoch));
		}

		function updateStatus(data) {
			const card = document.querySelector("#status-card");
			card.classList.toggle("on", data.display === "on");
			card.classList.toggle("off", data.display === "off");
			document.querySelector("#display-state").textContent = data.display === "on" ? "点灯中" : "消灯中";

			const manual = data.reason === "override";
			const badge = document.querySelector("#mode-badge");
			badge.textContent = manual ? "手動で上書き中" : "自動運転";
			badge.classList.toggle("manual", manual);
			document.querySelector("#mode-detail").textContent = manual
				? `${formatDateTime(data.override && data.override.until)}まで、この状態を保ちます`
				: `次の切り替え ${formatDateTime(data.nextEvaluationAt)}`;
			// 上書き中だけ「自動に戻す」を目立たせる。ふだんは押す用のないボタン。
			document.querySelector('[data-action="automatic"]').classList.toggle("suggested", manual);

			document.querySelector("#hardware-state").textContent =
				`DPMS ${data.dpms ?? "不明"} / PowerSaveMode ${data.powerSaveMode ?? "不明"}`;
			document.querySelector("#timezone").textContent = data.timeZone;
			document.querySelector("#auth-notice").classList.toggle("show", !data.authRequired);

			const serialized = JSON.stringify(data.schedule);
			// 入力途中を5秒更新で消さない。未編集で予定自体が変わったときだけ描き直す。
			if (!scheduleDirty && serialized !== renderedSchedule) renderSchedule(data.schedule);
		}

		/* ---- 予定 ---- */

		function splitTime(value) {
			const match = /^(\d{2}):(\d{2})$/.exec(value);
			const total = Number(match[1]) * 60 + Number(match[2]);
			const shown = total % (24 * 60);
			return {
				time: `${String(Math.floor(shown / 60)).padStart(2, "0")}:${String(shown % 60).padStart(2, "0")}`,
				nextDay: total >= 24 * 60,
			};
		}

		function dayCard(day) {
			return document.querySelector(`.day-card[data-day="${day}"]`);
		}

		function rawRows(day) {
			return [...dayCard(day).querySelector(".ranges").children].map((row) => ({
				from: row.querySelector(".from-time").value,
				to: row.querySelector(".to-time").value,
				nextDay: row.querySelector(".next-day-input").checked,
			}));
		}

		// 折りたたんだままでも中身が読めるように、見出しへ時間帯を並べておく。
		function updateDaySummary(day) {
			const target = dayCard(day).querySelector(".day-summary");
			const rows = rawRows(day)
				.filter((row) => row.from && row.to)
				.map((row) => `${row.from} – ${row.nextDay ? "翌" : ""}${row.to}`);
			target.replaceChildren(...(rows.length > 0 ? rows : ["終日消灯"]).map((text) => {
				const chip = document.createElement("span");
				chip.textContent = text;
				return chip;
			}));
			target.classList.toggle("empty", rows.length === 0);
		}

		function addRange(day, range = { from: "07:00", to: "08:00", nextDay: false }) {
			const row = document.createElement("div");
			row.className = "range-row";
			row.innerHTML = `
				<label class="field from"><span class="field-label">開始</span><input class="from-time" type="time" step="60" required></label>
				<span class="arrow" aria-hidden="true">–</span>
				<label class="field to"><span class="field-label">終了</span><input class="to-time" type="time" step="60" required></label>
				<label class="next-day"><input class="next-day-input" type="checkbox">終了は翌日</label>
				<button class="delete-row" type="button" aria-label="この時間帯を削除"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg><span class="delete-label">削除</span></button>`;
			row.querySelector(".from-time").value = range.from;
			row.querySelector(".to-time").value = range.to;
			row.querySelector(".next-day-input").checked = Boolean(range.nextDay);
			row.querySelectorAll("input").forEach((input) => input.addEventListener("input", () => {
				markDirty();
				row.classList.remove("invalid");
				updateDaySummary(day);
			}));
			row.querySelector(".delete-row").addEventListener("click", () => {
				row.remove();
				markDirty();
				updateDaySummary(day);
			});
			dayCard(day).querySelector(".ranges").append(row);
		}

		function replaceDay(day, rows) {
			const ranges = dayCard(day).querySelector(".ranges");
			ranges.replaceChildren();
			rows.forEach((row) => addRange(day, row));
			updateDaySummary(day);
		}

		function copyDay(sourceDay, targets) {
			const rows = rawRows(sourceDay);
			targets.forEach((day) => replaceDay(day, rows));
			markDirty();
			showNotice(message, `${DAYS[sourceDay]}の内容をコピーしました。保存するまで反映されません。`);
		}

		function renderSchedule(schedule) {
			// 5秒ごとの再描画で開いていた曜日が閉じないよう、開閉だけ引き継ぐ。
			const opened = new Set(
				[...scheduleRoot.querySelectorAll(".day-card[open]")].map((card) => Number(card.dataset.day)),
			);
			const today = new Date().getDay();
			if (opened.size === 0 && renderedSchedule === "") opened.add(today);

			scheduleRoot.replaceChildren();
			for (let day = 0; day < 7; day += 1) {
				const card = document.createElement("details");
				card.className = "day-card";
				card.dataset.day = day;
				card.open = opened.has(day);
				card.innerHTML = `
					<summary class="day-head">
						<svg class="icon chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
						<span class="day-name">${DAYS[day]}${day === today ? '<span class="day-badge">今日</span>' : ""}</span>
						<span class="day-summary"></span>
					</summary>
					<div class="day-body">
						<div class="ranges"></div>
						<div class="day-actions">
							<button type="button" class="add-row ghost"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>時間帯を追加</button>
							<button type="button" class="copy-weekdays"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>平日へコピー</button>
							<button type="button" class="copy-weekend"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>土日へコピー</button>
						</div>
					</div>`;
				scheduleRoot.append(card);
				card.querySelector(".add-row").addEventListener("click", () => {
					addRange(day);
					markDirty();
					updateDaySummary(day);
				});
				card.querySelector(".copy-weekdays").addEventListener("click", () => copyDay(day, [1, 2, 3, 4, 5]));
				card.querySelector(".copy-weekend").addEventListener("click", () => copyDay(day, [0, 6]));
				for (const range of schedule[day]) {
					const to = splitTime(range.to);
					addRange(day, { from: range.from, to: to.time, nextDay: to.nextDay });
				}
				updateDaySummary(day);
			}
			renderedSchedule = JSON.stringify(schedule);
			clearDirty();
		}

		function collectSchedule() {
			const schedule = {};
			const errors = [];
			for (let day = 0; day < 7; day += 1) {
				schedule[day] = [];
				const rows = document.querySelectorAll(`.day-card[data-day="${day}"] .range-row`);
				rows.forEach((row, index) => {
					row.classList.remove("invalid");
					const from = row.querySelector(".from-time").value;
					const shownTo = row.querySelector(".to-time").value;
					const nextDay = row.querySelector(".next-day-input").checked;
					// 閉じたままだと赤くしても見えないので、問題のある曜日は開いておく。
					const flag = (text) => {
						row.classList.add("invalid");
						dayCard(day).open = true;
						errors.push(text);
					};
					if (!from || !shownTo) {
						flag(`${DAYS[day]} ${index + 1}行目の時刻を入力してください`);
						return;
					}
					const [fromHour, fromMinute] = from.split(":").map(Number);
					const [toHour, toMinute] = shownTo.split(":").map(Number);
					const fromTotal = fromHour * 60 + fromMinute;
					const toTotal = toHour * 60 + toMinute + (nextDay ? 24 * 60 : 0);
					if (toTotal <= fromTotal) {
						flag(`${DAYS[day]} ${index + 1}行目の終了は開始より後にしてください`);
						return;
					}
					schedule[day].push({
						from,
						to: `${String(Math.floor(toTotal / 60)).padStart(2, "0")}:${String(toTotal % 60).padStart(2, "0")}`,
					});
				});
			}
			return { schedule, errors };
		}

		/* ---- 操作 ---- */

		async function runButton(button, action, successText) {
			button.disabled = true;
			try {
				const result = await action();
				if (result && result.schedule) updateStatus(result);
				showNotice(message, successText);
			} catch (error) {
				showNotice(message, `操作できませんでした: ${error.message}`, true);
			} finally {
				button.disabled = false;
			}
		}

		document.querySelector('[data-action="display-on"]').addEventListener("click", function () {
			runButton(this, () => callApi("/api/display/on", { method: "POST" }), "画面をつけました。");
		});
		document.querySelector('[data-action="display-off"]').addEventListener("click", function () {
			if (!window.confirm("次の自動切り替えまで画面を消します。よろしいですか？")) return;
			runButton(this, () => callApi("/api/display/off", { method: "POST" }), "画面を消しました。");
		});
		document.querySelector('[data-action="off-morning"]').addEventListener("click", function () {
			runButton(this, () => callApi("/api/display/off-until-morning", { method: "POST" }), "明日の朝7時まで消灯します。");
		});
		document.querySelector('[data-action="automatic"]').addEventListener("click", function () {
			runButton(this, () => callApi("/api/override", { method: "DELETE" }), "自動運転に戻しました。");
		});

		document.querySelectorAll("[data-slideshow]").forEach((button) => {
			button.addEventListener("click", function () {
				const labels = { pause: "一時停止しました。", resume: "再開しました。", prev: "前の画像へ移動しました。", next: "次の画像へ移動しました。" };
				runButton(this, () => callApi(`/api/slideshow/${this.dataset.slideshow}`, { method: "POST" }), labels[this.dataset.slideshow]);
			});
		});

		document.querySelector("#save-schedule").addEventListener("click", function () {
			const collected = collectSchedule();
			if (collected.errors.length > 0) {
				showNotice(scheduleErrors, collected.errors.join("\n"), true);
				return;
			}
			showNotice(scheduleErrors, "");
			runButton(this, async () => {
				const result = await callApi("/api/schedule", {
					method: "PUT",
					body: JSON.stringify(collected.schedule),
				});
				clearDirty();
				renderedSchedule = "";
				return result;
			}, "予定を保存し、画面へ反映しました。");
		});

		async function refresh() {
			try {
				updateStatus(await callApi("/api/status"));
			} catch (error) {
				showNotice(message, `状態を取得できません: ${error.message}`, true);
			}
		}

		refresh();
		setInterval(refresh, 5000);
	</script>
</body>
</html>
